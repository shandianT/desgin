# 把三个 npm 包发布到 GitHub Packages（npm.pkg.github.com，scope @shandiant）。
# 触发：Actions 页面「Run workflow」按钮，或推一个 v 开头的标签。
# 用仓库自带的 GITHUB_TOKEN，不用另外配 secret。
name: publish-npm

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 要发的包，逗号分隔：tokens,ui-react,ui-miniprogram
        default: tokens,ui-react,ui-miniprogram
      dry_run:
        description: 只打包不发布（true / false）
        default: 'false'
  push:
    tags: ['v*']
    # main 上包版本号变了也发布；已发过的版本自动跳过
    branches: [main]
    paths: ['packages/*/package.json']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@shandiant'
      - name: 装 Web 组件库依赖
        run: cd packages/ui-react && npm ci --legacy-peer-deps
      - name: 装小程序组件库测试依赖
        run: cd packages/ui-miniprogram && npm ci
      - name: 自检
        run: node tools/check.mjs
      - name: 发布
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKGS: ${{ github.event.inputs.packages || 'tokens,ui-react,ui-miniprogram' }}
          DRY: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -e
          for p in tokens ui-react ui-miniprogram; do
            case ",$PKGS," in *",$p,"*) ;; *) echo "跳过 $p"; continue;; esac
            cd packages/$p
            v=$(node -p "require('./package.json').version")
            if npm view "@shandiant/$p@$v" version >/dev/null 2>&1; then echo "@shandiant/$p@$v 已发布，跳过"; cd ../..; continue; fi
            tag=latest; case "$v" in *-*) tag=draft;; esac
            extra=""; [ "$DRY" = "true" ] && extra="--dry-run"
            echo "发布 @shandiant/$p@$v（tag $tag）"
            npm publish --tag "$tag" $extra
            cd ../..
          done
