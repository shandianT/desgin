<title>客户列表与详情样板</title>
<style>
/* 部门产品设计变量 1.1.0-draft.1 · 2026-09-19
 * 由 build-tokens.mjs 从 tokens.json 生成，请勿手工修改；改 tokens.json 后重新生成。
 * 目标：电脑网页与手机网页（同一份文件，≤600px 覆盖）。状态：草案：基础与语义层的值来自已确认的 SalesBuddy Web V1.0（design-tokens.css）；主色 #2863CD 已于 2026-09-19 决定沿用；标注「建议」的条目与端侧映射尚未登记采用；原生 App 暂不在范围
 */
:root {
  color-scheme: light;
  --ui-background: #F3F5F9;
  --ui-surface: #FFFFFF;
  --ui-sidebar: #142F54;
  --ui-ink: #192842;
  --ui-secondary: #5B6C82;
  --ui-muted: #617188;
  --ui-primary: #2863CD;
  --ui-primary-hover: #2055B5;
  --ui-line: #E2E8F0;
  --ui-selected: #EDF3FF;
  --ui-focus: #5786DC;
  --ui-danger: #A73F38;
  --ui-danger-soft: #FBE4DF;
  --ui-warning: #805919;
  --ui-warning-soft: #FFF0CF;
  --ui-success: #27694C;
  --ui-success-soft: #E8F5EE;
  --ui-neutral: #56677E;
  --ui-neutral-soft: #EEF2F7;
  --ui-font: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --ui-text-small: 12px;
  --ui-text-body: 14px;
  --ui-text-section: 16px;
  --ui-text-page: 24px;
  --ui-text-metric: 32px;
  --ui-space-1: 4px;
  --ui-space-2: 8px;
  --ui-space-3: 12px;
  --ui-space-4: 16px;
  --ui-space-6: 24px;
  --ui-space-8: 32px;
  --ui-radius-control: 6px;
  --ui-radius-panel: 12px;
  --ui-control-height: 36px;
  --ui-field-height: 40px;
  --ui-shadow-popup: 0 8px 28px #1928421a, 0 2px 6px #19284208;
  --ui-page-gutter: 24px;
  --ui-card-padding: 16px;
  --ui-block-gap: 24px;
  --ui-touch-target: 44px;
  --ui-nav-width: 220px;
  --ui-nav-rail-width: 56px;
  --ui-list-width: 360px;
  --ui-tabbar-height: 56px;
  --ui-on-primary: #FFFFFF;
  --ui-sidebar-ink: #E7EFFA;
  --ui-sidebar-nav: #C2D1E6;
  --ui-sidebar-muted: #B4C7E1;
  --ui-sidebar-hover: #23466F;
  --ui-sidebar-active: #2A568B;
  --ui-sidebar-accent: #91BAFF;
  --ui-sidebar-focus: #B9D2FF;
}

/* 手机网页：仅覆盖端侧映射里声明的语义变量（建议，待验证） */
@media (max-width: 600px) {
  :root {
    --ui-text-body: 16px;
    --ui-page-gutter: 16px;
  }
}
</style>
<style>
/* ============================================================
   跨端样板：客户列表 → 详情 → 返回
   规则引用：P-01～P-03、V-01～V-04、C-01/C-04/C-05/C-06/C-07、T-02、T-03、B-01～B-05；
   跨端建议：X-02（桌面三段）、X-03（手机返回保留）、X-05（三档）、X-06（16px／44px）、X-07（安全区）、X-11（状态覆盖）。
   合成数据，不连接接口，不代表权限校验。
   ============================================================ */
html, body { height: 100%; }
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--ui-background); color: var(--ui-ink);
  font-family: var(--ui-font); font-size: var(--ui-text-body); line-height: 1.65;
  -webkit-font-smoothing: antialiased; overflow: hidden;
}
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input { font: inherit; }
:is(button, a, input, [tabindex="0"]):focus-visible { outline: 2px solid var(--ui-focus); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- 外层：导航 + 工作区 ---------- */
.app { height: 100%; display: grid; grid-template-columns: var(--ui-nav-width) minmax(0, 1fr); }
.nav { background: var(--ui-sidebar); color: var(--ui-sidebar-ink); display: flex; flex-direction: column; padding: var(--ui-space-4) var(--ui-space-3); gap: var(--ui-space-1); }
.brand { display: flex; align-items: center; gap: var(--ui-space-2); padding: var(--ui-space-2) var(--ui-space-2) var(--ui-space-4); color: var(--ui-on-primary); font-weight: 650; font-size: var(--ui-text-section); }
.brand .mark { width: 28px; height: 28px; border-radius: 8px; background: var(--ui-primary); display: grid; place-items: center; font-size: 12px; letter-spacing: .02em; }
.brand small { display: block; font-weight: 400; font-size: var(--ui-text-small); color: var(--ui-sidebar-muted); line-height: 1.4; }
.nav-item { display: flex; align-items: center; gap: var(--ui-space-3); min-height: var(--ui-control-height); padding: 0 var(--ui-space-3); border-radius: var(--ui-radius-control); color: var(--ui-sidebar-nav); text-decoration: none; }
.nav-item svg { width: 18px; height: 18px; flex: none; }
.nav-item:hover { background: var(--ui-sidebar-hover); color: var(--ui-on-primary); }
.nav-item[aria-current="page"] { background: var(--ui-sidebar-active); color: var(--ui-on-primary); box-shadow: inset 3px 0 var(--ui-sidebar-accent); font-weight: 600; }
.nav-item:focus-visible { outline-color: var(--ui-sidebar-focus); }
.nav-foot { margin-top: auto; padding: var(--ui-space-3) var(--ui-space-2) 0; color: var(--ui-sidebar-muted); font-size: var(--ui-text-small); line-height: 1.5; }
.nav-foot b { display: block; color: var(--ui-on-primary); font-weight: 600; }

.work { position: relative; min-width: 0; min-height: 0; display: grid; grid-template-columns: var(--ui-list-width) minmax(0, 1fr); }

/* ---------- 列表栏（T-02、C-04、C-05） ---------- */
.list-pane { display: flex; flex-direction: column; min-height: 0; background: var(--ui-surface); border-right: 1px solid var(--ui-line); }
.list-head { padding: var(--ui-space-4) var(--ui-space-4) 0; display: flex; flex-direction: column; gap: var(--ui-space-3); }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: var(--ui-space-3); }
.title-row h1 { font-size: var(--ui-text-page); font-weight: 650; line-height: 1.5; }
.scope { color: var(--ui-secondary); font-size: var(--ui-text-small); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--ui-space-1); min-height: var(--ui-control-height); padding: 0 var(--ui-space-4); border-radius: var(--ui-radius-control); border: 1px solid transparent; white-space: nowrap; }
.btn-primary { background: var(--ui-primary); color: var(--ui-on-primary); }
.btn-primary:hover { background: var(--ui-primary-hover); }
.btn-secondary { background: var(--ui-surface); color: var(--ui-primary); border-color: var(--ui-line); }
.btn-secondary:hover { background: var(--ui-selected); }
.btn-ghost { color: var(--ui-secondary); padding: 0 var(--ui-space-2); min-width: var(--ui-control-height); }
.btn-ghost:hover { background: var(--ui-neutral-soft); color: var(--ui-ink); }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.search { position: relative; }
.search input { width: 100%; height: var(--ui-field-height); padding: 0 var(--ui-space-8) 0 var(--ui-space-4); border: 1px solid var(--ui-line); border-radius: var(--ui-radius-control); background: var(--ui-surface); color: var(--ui-ink); }
.search input::placeholder { color: var(--ui-muted); }
.search input:focus { border-color: var(--ui-focus); outline: 2px solid var(--ui-focus); outline-offset: 0; }
.search .clear { position: absolute; right: 4px; top: 4px; width: 32px; height: 32px; border-radius: var(--ui-radius-control); color: var(--ui-muted); display: grid; place-items: center; }
.search .clear:hover { background: var(--ui-neutral-soft); color: var(--ui-ink); }
.search .clear[hidden] { display: none; }
.chips { display: flex; gap: var(--ui-space-2); overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 32px; padding: 0 var(--ui-space-3); border-radius: 999px; border: 1px solid var(--ui-line); color: var(--ui-secondary); background: var(--ui-surface); }
.chip:hover { border-color: var(--ui-focus); color: var(--ui-primary); }
.chip[aria-pressed="true"] { background: var(--ui-selected); border-color: var(--ui-primary); color: var(--ui-primary); font-weight: 600; }
.result-line { display: flex; align-items: center; justify-content: space-between; gap: var(--ui-space-2); padding: var(--ui-space-2) var(--ui-space-4); border-top: 1px solid var(--ui-line); border-bottom: 1px solid var(--ui-line); color: var(--ui-secondary); font-size: var(--ui-text-small); margin-top: var(--ui-space-3); }
.result-line .conds { display: flex; gap: var(--ui-space-1); flex-wrap: wrap; align-items: center; min-width: 0; }
.result-line .cond { padding: 0 var(--ui-space-2); border-radius: 4px; background: var(--ui-neutral-soft); color: var(--ui-neutral); white-space: nowrap; }
.link { color: var(--ui-primary); text-decoration: none; white-space: nowrap; }
.link:hover { text-decoration: underline; }

.list-scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.rows { list-style: none; margin: 0; padding: 0; }
.row { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: var(--ui-space-3); align-items: center; width: 100%; text-align: left; padding: var(--ui-space-3) var(--ui-space-4); border-bottom: 1px solid var(--ui-line); min-height: 64px; }
.row:hover { background: var(--ui-background); }
.row[aria-current="true"] { background: var(--ui-selected); box-shadow: inset 3px 0 var(--ui-primary); }
.row:focus-visible { outline-offset: -2px; }
.avatar { width: 40px; height: 40px; border-radius: 10px; background: var(--ui-neutral-soft); color: var(--ui-primary); display: grid; place-items: center; font-weight: 650; }
.row-main { min-width: 0; }
.row-name { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.core { display: inline-block; vertical-align: 2px; margin-right: var(--ui-space-1); padding: 0 6px; border-radius: 4px; border: 1px solid var(--ui-primary); color: var(--ui-primary); font-size: var(--ui-text-small); line-height: 18px; font-weight: 600; }
.row-meta { display: block; color: var(--ui-secondary); font-size: var(--ui-text-small); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 0 var(--ui-space-2); border-radius: 4px; font-size: var(--ui-text-small); line-height: 20px; white-space: nowrap; }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge.red { background: var(--ui-danger-soft); color: var(--ui-danger); }
.badge.yellow { background: var(--ui-warning-soft); color: var(--ui-warning); }
.badge.green { background: var(--ui-success-soft); color: var(--ui-success); }
.badge.gray { background: var(--ui-neutral-soft); color: var(--ui-neutral); }
.badge.plain::before { display: none; }
.row-time { color: var(--ui-muted); font-size: var(--ui-text-small); }

/* 列表状态（C-06） */
.state { padding: var(--ui-space-8) var(--ui-space-4); text-align: center; color: var(--ui-secondary); display: flex; flex-direction: column; align-items: center; gap: var(--ui-space-3); }
.state b { color: var(--ui-ink); font-size: var(--ui-text-section); font-weight: 600; }
.state p { max-width: 32em; }
.skeleton { padding: 0 var(--ui-space-4); }
.skeleton div { height: 64px; border-bottom: 1px solid var(--ui-line); position: relative; }
.skeleton div::before { content: ""; position: absolute; left: 0; top: 12px; width: 40px; height: 40px; border-radius: 10px; background: var(--ui-neutral-soft); }
.skeleton div::after { content: ""; position: absolute; left: 52px; top: 18px; width: 60%; height: 12px; border-radius: 4px; background: var(--ui-neutral-soft); box-shadow: 0 20px 0 -2px var(--ui-neutral-soft); }
.sr-live { position: absolute; left: -9999px; }

/* ---------- 详情栏（T-03、C-07） ---------- */
.detail-pane { min-height: 0; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; container-type: inline-size; }
.detail-empty { flex: 1; display: grid; place-items: center; color: var(--ui-secondary); text-align: center; padding: var(--ui-space-8); }
.detail-empty b { display: block; color: var(--ui-ink); font-size: var(--ui-text-section); margin-bottom: var(--ui-space-1); }
.detail-bar { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: var(--ui-space-2); min-height: 56px; padding: var(--ui-space-2) var(--ui-page-gutter); background: var(--ui-surface); border-bottom: 1px solid var(--ui-line); }
.detail-bar .crumb { min-width: 0; flex: 1; color: var(--ui-secondary); font-size: var(--ui-text-small); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.detail-bar .crumb b { color: var(--ui-ink); font-size: var(--ui-text-body); font-weight: 600; }
.back { display: none; align-items: center; gap: var(--ui-space-1); min-height: var(--ui-touch-target); min-width: var(--ui-touch-target); padding: 0 var(--ui-space-2); border-radius: var(--ui-radius-control); color: var(--ui-primary); font-weight: 600; }
.back:hover { background: var(--ui-selected); }
.close { display: inline-flex; }
.detail-body { padding: var(--ui-page-gutter); display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--ui-block-gap); align-content: start; }
/* 详情栏实际宽度 ≥ 760px 时才分主栏／辅栏（T-03）；更窄时辅栏落到主栏下方。用容器查询按详情栏宽度判断，而不是按窗口宽度 */
@container (min-width: 760px) { .detail-body { grid-template-columns: minmax(0, 1fr) 280px; } }
.detail-main { display: flex; flex-direction: column; gap: var(--ui-block-gap); min-width: 0; }
.detail-side { display: flex; flex-direction: column; gap: var(--ui-block-gap); min-width: 0; }
.panel { background: var(--ui-surface); border: 1px solid var(--ui-line); border-radius: var(--ui-radius-panel); padding: var(--ui-card-padding); }
.panel h2 { font-size: var(--ui-text-section); font-weight: 600; line-height: 1.5; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--ui-space-2); margin-bottom: var(--ui-space-3); }
.panel-head small { color: var(--ui-muted); font-size: var(--ui-text-small); }
.hero { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: var(--ui-space-4); align-items: start; }
.hero .avatar { width: 56px; height: 56px; font-size: var(--ui-text-page); }
.hero h1 { font-size: var(--ui-text-page); font-weight: 650; line-height: 1.5; overflow-wrap: anywhere; }
.hero .meta { color: var(--ui-secondary); display: flex; flex-wrap: wrap; gap: var(--ui-space-1) var(--ui-space-3); margin-top: var(--ui-space-1); }
.hero .badges { display: flex; flex-wrap: wrap; gap: var(--ui-space-2); margin-top: var(--ui-space-3); }
.actions { display: flex; flex-wrap: wrap; gap: var(--ui-space-2); margin-top: var(--ui-space-4); }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: var(--ui-space-2) var(--ui-space-4); }
.kv dt { color: var(--ui-secondary); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.missing { color: var(--ui-muted); }
.meter { display: grid; grid-template-columns: 1fr auto; gap: var(--ui-space-2); align-items: center; margin-top: var(--ui-space-2); }
.meter .track { height: 8px; border-radius: 999px; background: var(--ui-neutral-soft); overflow: hidden; }
.meter .track i { display: block; height: 100%; background: var(--ui-primary); border-radius: 999px; }
.meter b { font-size: var(--ui-text-section); }
.evidence { display: flex; flex-wrap: wrap; gap: var(--ui-space-1); margin-top: var(--ui-space-2); }
.evidence span { padding: 0 var(--ui-space-2); border-radius: 4px; background: var(--ui-neutral-soft); color: var(--ui-neutral); font-size: var(--ui-text-small); line-height: 20px; }
.note { color: var(--ui-muted); font-size: var(--ui-text-small); margin-top: var(--ui-space-3); }
.tabs { display: flex; gap: var(--ui-space-1); border-bottom: 1px solid var(--ui-line); margin-bottom: var(--ui-space-4); overflow-x: auto; scrollbar-width: none; }
.tab { flex: none; min-height: var(--ui-control-height); padding: 0 var(--ui-space-3); color: var(--ui-secondary); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab:hover { color: var(--ui-ink); }
.tab[aria-selected="true"] { color: var(--ui-primary); border-color: var(--ui-primary); font-weight: 600; }
.card-list { display: flex; flex-direction: column; gap: var(--ui-space-3); }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--ui-space-2) var(--ui-space-3); padding: var(--ui-space-3); border: 1px solid var(--ui-line); border-radius: var(--ui-radius-control); }
.item .t { font-weight: 600; overflow-wrap: anywhere; }
.item .s { color: var(--ui-secondary); font-size: var(--ui-text-small); }
.item .amt { font-weight: 600; text-align: right; white-space: nowrap; }
.timeline { display: flex; flex-direction: column; }
.tl { display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: var(--ui-space-3); padding: var(--ui-space-3) 0; border-bottom: 1px solid var(--ui-line); }
.tl:last-child { border-bottom: 0; }
.tl .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ui-primary); margin-top: 7px; }
.tl .when { color: var(--ui-muted); font-size: var(--ui-text-small); }
.tl summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: var(--ui-space-2); }
.tl summary::-webkit-details-marker { display: none; }
.tl summary::after { content: "展开"; color: var(--ui-primary); font-weight: 400; font-size: var(--ui-text-small); white-space: nowrap; }
.tl details[open] summary::after { content: "收起"; }
.tl .body { margin-top: var(--ui-space-2); color: var(--ui-ink); white-space: pre-line; }
.tl .next { margin-top: var(--ui-space-2); padding: var(--ui-space-2) var(--ui-space-3); border-left: 3px solid var(--ui-success); background: var(--ui-success-soft); border-radius: 0 6px 6px 0; }
.detail-state { padding: var(--ui-space-8) var(--ui-page-gutter); text-align: center; color: var(--ui-secondary); display: flex; flex-direction: column; align-items: center; gap: var(--ui-space-3); }
.detail-state b { color: var(--ui-ink); font-size: var(--ui-text-section); }
.action-bar { display: none; }

/* ---------- 演示控制（仅样板，用于验收；产品中不存在） ---------- */
.demo-toggle { position: fixed; right: var(--ui-space-3); top: var(--ui-space-3); z-index: 20; min-height: 32px; padding: 0 var(--ui-space-3); border-radius: 999px; background: var(--ui-ink); color: var(--ui-on-primary); font-size: var(--ui-text-small); box-shadow: var(--ui-shadow-popup); }
.demo { position: fixed; right: var(--ui-space-3); top: 52px; z-index: 20; width: 280px; max-width: calc(100vw - 24px); padding: var(--ui-space-4); background: var(--ui-surface); border: 1px solid var(--ui-line); border-radius: var(--ui-radius-panel); box-shadow: var(--ui-shadow-popup); font-size: var(--ui-text-small); color: var(--ui-secondary); }
.demo[hidden] { display: none; }
.demo h2 { font-size: var(--ui-text-body); color: var(--ui-ink); margin-bottom: var(--ui-space-2); }
.demo fieldset { border: 0; padding: 0; margin: 0 0 var(--ui-space-3); }
.demo legend { font-weight: 600; color: var(--ui-ink); padding: 0; margin-bottom: 4px; }
.demo label { display: flex; align-items: center; gap: 6px; min-height: 28px; }
.demo .mode { padding: var(--ui-space-2); border-radius: 6px; background: var(--ui-neutral-soft); color: var(--ui-neutral); }
.demo .mode b { color: var(--ui-ink); }

/* ============================================================
   601～900px：导航折叠为图标栏；列表与详情二选一（X-02、X-05）
   ============================================================ */
@media (max-width: 900px) {
  .app { grid-template-columns: var(--ui-nav-rail-width) minmax(0, 1fr); }
  .nav { padding: var(--ui-space-3) var(--ui-space-1); align-items: stretch; }
  .brand { justify-content: center; padding: var(--ui-space-1) 0 var(--ui-space-3); }
  .brand span, .nav-item span, .nav-foot { display: none; }
  .nav-item { justify-content: center; padding: 0; min-height: var(--ui-touch-target); }
  .nav-item[aria-current="page"] { box-shadow: inset 0 -3px var(--ui-sidebar-accent); }
  .work { grid-template-columns: minmax(0, 1fr); overflow: hidden; }
  .list-pane { border-right: 0; }
  .detail-pane { position: absolute; inset: 0; z-index: 2; background: var(--ui-background); transform: translateX(100%); transition: transform .22s ease; visibility: hidden; }
  .app.detail-open .detail-pane { transform: none; visibility: visible; }
  .back { display: inline-flex; }
  .close { display: none; }
  .detail-empty { display: none; }
  .detail-body { grid-template-columns: minmax(0, 1fr); }
  .demo-toggle { top: auto; bottom: var(--ui-space-3); }
  .demo { top: auto; bottom: 52px; }
}

/* ============================================================
   ≤600px：手机。底部导航、单栏、详情整页进入、安全区（X-03、X-06、X-07）

  function followText(c) { return c.lastFollow ? (c.lastDays === 0 ? '今天跟进' : c.lastDays + ' 天前跟进') : '未填写跟进'; }
  function renderList() {
    $('total-count').textContent = CUSTOMERS.length;
    q.value = state.q; qClear.hidden = !state.q;
    Array.prototype.forEach.call(chips.querySelectorAll('.chip'), function (b) { b.setAttribute('aria-pressed', String(b.dataset.filter === state.filter)); });
    var list = filtered();
    var conds = '<span>客户列表 · 共 <b class="num" id="result-count">' + list.length + '</b> 家</span>';
    if (state.q) conds += '<span class="cond">搜索：' + esc(state.q) + '</span>';
    if (state.filter !== 'all') conds += '<span class="cond">' + (state.filter === 'attention' ? '有风险' : QUAD[state.filter]) + '</span>';
    $('conds').innerHTML = conds;
    reset.hidden = !(state.q || state.filter !== 'all');
    rows.innerHTML = ''; listStateEl.innerHTML = '';
    if (state.listState === 'loading') {
      listStateEl.innerHTML = '<div class="skeleton" aria-label="正在加载客户列表"><div></div><div></div><div></div><div></div></div><div class="state"><span>正在加载客户列表…</span></div>';
      return;
    }
    if (state.listState === 'error') {
      listStateEl.innerHTML = '<div class="state" role="alert"><b>客户列表加载失败</b><p>网络或服务暂时不可用。重试不会丢失当前搜索与筛选条件。</p><button class="btn btn-secondary" type="button" id="retry">重试</button></div>';
      $('retry').addEventListener('click', function () { setListState('normal'); });
      return;
    }
    if (!list.length) {
      listStateEl.innerHTML = '<div class="state"><b>没有匹配的客户</b><p>当前范围「本人负责」内没有符合条件的客户。可以清除条件，或检查关键词是否正确。</p><button class="btn btn-secondary" type="button" id="empty-reset">清除条件</button></div>';
      $('empty-reset').addEventListener('click', resetFilters);
      return;
    }
    var frag = document.createDocumentFragment();
    list.forEach(function (c) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'row'; b.dataset.id = c.id; b.setAttribute('aria-current', String(c.id === state.selectedId));
      b.title = c.name;
      b.innerHTML = '<span class="avatar" aria-hidden="true">' + esc(c.name.charAt(0)) + '</span>' +
        '<span class="row-main"><span class="row-name">' + (c.core ? '<span class="core" title="集团审定核心客户">核心</span>' : '') + esc(c.name) + '</span><span class="row-meta">' + (c.quad === 'pending' ? '象限：待评估' : QUAD[c.quad]) + ' · 关系 ' + c.relation + '/10 · 地盘 ' + esc(c.zone) + '</span></span>' +
        '<span class="row-side"><span class="badge ' + c.tone + '">' + TONE[c.tone] + '</span><span class="row-time num">' + followText(c) + '</span></span>';
      b.addEventListener('click', function () { openDetail(c.id, true); });
      li.appendChild(b); frag.appendChild(li);
    });
    rows.appendChild(frag);
  }
  function announce(t) { live.textContent = ''; setTimeout(function () { live.textContent = t; }, 50); }
  function setListState(s) { state.listState = s; save(); renderList(); syncDemo(); }
  function resetFilters() { state.q = ''; state.filter = 'all'; save(); renderList(); announce('已清除条件'); q.focus(); }

  q.addEventListener('input', function () { state.q = q.value; save(); renderList(); });
  qClear.addEventListener('click', function () { state.q = ''; save(); renderList(); q.focus(); });
  chips.addEventListener('click', function (e) { var b = e.target.closest('.chip'); if (!b) return; state.filter = b.dataset.filter; save(); renderList(); });
  reset.addEventListener('click', resetFilters);
  $('new-customer').addEventListener('click', function () { announce('样板未实现新建客户；产品中打开新建表单'); });
  Array.prototype.forEach.call(document.querySelectorAll('.nav-item'), function (a) { a.addEventListener('click', function (e) { e.preventDefault(); announce(a.classList.contains('mobile-only') ? '样板未实现更多菜单；产品中展开拜访与跟进、经营分析' : '样板只实现客户模块；其他导航项不可用'); }); });
  var scrollTimer;
  listScroll.addEventListener('scroll', function () {
    // 详情打开期间不记录：手机上底部导航隐藏会改变列表容器高度，浏览器可能夹紧 scrollTop，记录会被污染
    if (app.classList.contains('detail-open')) return;
    clearTimeout(scrollTimer); scrollTimer = setTimeout(function () { if (!app.classList.contains('detail-open')) { state.scroll = listScroll.scrollTop; save(); } }, 80);
  });
  rows.addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    var items = Array.prototype.slice.call(rows.querySelectorAll('.row'));
    var i = items.indexOf(document.activeElement); if (i < 0) return;
    e.preventDefault(); var n = items[Math.max(0, Math.min(items.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)))]; n.focus();
  });

  // ---------- 详情 ----------
  var lastTrigger = null;
  function openDetail(id, push) {
    var c = CUSTOMERS.filter(function (x) { return x.id === id; })[0];
    if (!c) return;
    lastTrigger = rows.querySelector('.row[data-id="' + id + '"]');
    state.selectedId = id; state.tab = 'overview'; save();
    Array.prototype.forEach.call(rows.querySelectorAll('.row'), function (r) { r.setAttribute('aria-current', String(r.dataset.id === id)); });
    if (push && !EMBEDDED) history.pushState({ detail: id }, '', '#c=' + id);
    app.classList.add('detail-open');
    detailEmpty.hidden = true; detailContent.hidden = false;
    detailContent.innerHTML = '<div class="detail-bar"><button class="back" type="button" id="back">‹ 返回列表</button><div class="crumb">客户 › <b>正在加载…</b></div></div><div class="detail-state" aria-busy="true"><span>正在加载客户…</span></div>';
    bindBack();
    detail.scrollTop = 0;
    if (state.detailState === 'forbidden') { renderDetailState(c, '暂无查看权限', '该客户不在你的授权范围内，或权限已变化；不显示客户信息。列表中的搜索与筛选仍然保留。', true); return; }
    if (state.detailState === 'error') { renderDetailState(c, '客户加载失败', '网络或服务暂时不可用。', false); return; }
    setTimeout(function () { if (state.selectedId === id) renderDetail(c); }, 240);
  }
  function renderDetailState(c, title, text, forbidden) {
    // 无权限时不显示客户名称与任何字段（B-15：不暴露敏感内容）
    var crumb = forbidden ? '客户 › <b>客户详情</b>' : '客户 › <b>' + esc(c.name) + '</b>';
    detailContent.innerHTML = '<div class="detail-bar"><button class="back" type="button" id="back">‹ 返回列表</button><div class="crumb">' + crumb + '</div><button class="btn btn-ghost close" type="button" id="close" aria-label="关闭详情">×</button></div>' +
      '<div class="detail-state" role="alert"><b>' + title + '</b><p>' + text + '</p>' + (forbidden ? '<button class="btn btn-secondary" type="button" id="back2">返回列表</button>' : '<button class="btn btn-secondary" type="button" id="retry-detail">重试</button>') + '</div>';
    bindBack();
    if (forbidden) $('back2').addEventListener('click', closeDetail);
    else $('retry-detail').addEventListener('click', function () { state.detailState = 'normal'; save(); syncDemo(); openDetail(c.id, false); });
    focusDetail();
  }
  function renderDetail(c) {
    var attn = attention(c);
    var html = '<div class="detail-bar"><button class="back" type="button" id="back">‹ 返回列表</button><div class="crumb">客户 › <b>' + esc(c.name) + '</b></div><button class="btn btn-ghost close" type="button" id="close" aria-label="关闭详情（Esc）">×</button></div>' +
      '<div class="detail-body"><div class="detail-main">' +
      '<div class="panel"><div class="hero"><span class="avatar" aria-hidden="true">' + esc(c.name.charAt(0)) + '</span><div><h1>' + esc(c.name) + '</h1>' +
      '<div class="meta"><span>地盘 ' + esc(c.zone) + ' · ' + esc(c.owner) + '</span><span>' + (c.lastFollow ? '最近跟进 ' + fmtDate(c.lastFollow) : '<span class="missing">最近跟进：未填写</span>') + '</span></div>' +
      '<div class="badges"><span class="badge ' + c.tone + '">' + TONE[c.tone] + '</span>' + (c.core ? '<span class="badge gray plain">核心客户</span>' : '') + '<span class="badge gray plain">' + (c.quad === 'pending' ? '象限：待评估' : QUAD[c.quad]) + '</span><span class="badge gray plain">关系 ' + c.relation + '/10</span><span class="badge gray plain">潜力：' + (c.potential == null ? '待评估' : c.potential) + '</span></div>' +
      '<div class="actions"><button class="btn btn-primary" type="button" data-act="visit">记录拜访</button><button class="btn btn-secondary" type="button" data-act="task">创建任务</button></div></div></div></div>' +
      '<div class="tabs" role="tablist" aria-label="客户详情页签"><button class="tab" role="tab" data-tab="overview">经营概览</button><button class="tab" role="tab" data-tab="visits">跟进记录</button><button class="tab" role="tab" data-tab="tasks">待办与任务</button></div>' +
      '<div id="tab-overview" role="tabpanel">' +
        '<div class="panel"><div class="panel-head"><h2>象限判断依据</h2><small>由已确认事实重算，不可手工改分</small></div>' +
        '<div class="meter"><div class="track"><i style="width:' + c.relation * 10 + '%"></i></div><b class="num">关系 ' + c.relation + '/10</b></div>' +
        '<dl class="kv" style="margin-top:var(--ui-space-3)"><dt>潜力</dt><dd>' + (c.potential == null ? '<span class="missing">待评估（依据不足，不评分）</span>' : c.potential + '（看预算、台数、IT 计划，不看销量）') + '</dd></dl>' +
        '<div class="evidence">' + c.evidence.map(function (e) { return '<span>' + esc(e) + '</span>'; }).join('') + '</div>' +
        '<p class="note">' + (c.quad === 'pending' ? '象限：待评估。关系或潜力缺少依据时不落入任何一格。' : QUAD[c.quad] + '：' + ({ attack: '潜力高、关系浅，重点投入，建立高层与技术关系', asset: '潜力高、关系深，持续经营的客户资产', order: '潜力低、关系浅，见单打单', resource: '潜力低、关系深，交给技术人员维护，销售不必频繁拜访，观察是否长大' })[c.quad] + '。') + ' 合成阈值：关系 ≥6 视为深关系；真实阈值为租户配置。</p></div>' +
        '<div class="panel" style="margin-top:var(--ui-block-gap)"><div class="panel-head"><h2>在推商机</h2><small>' + c.opps.length + ' 条 · 商机归属本客户</small></div>' +
        (c.opps.length ? '<div class="card-list">' + c.opps.map(function (o) { return '<div class="item"><div><div class="t">' + esc(o.name) + '</div><div class="s">阶段：' + STAGES[o.prob] + ' · 赢单概率 ' + o.prob + '%</div></div><div class="amt num">' + (o.acv == null ? '<span class="missing">ACV 未登记</span>' : money(o.acv)) + '</div></div>'; }).join('') + '</div>' : '<p class="missing">暂无在推商机。</p>') + '</div>' +
        '<div class="panel" style="margin-top:var(--ui-block-gap)"><div class="panel-head"><h2>关键联系人</h2><small>' + c.contacts.length + ' 人</small></div><dl class="kv">' + c.contacts.map(function (p) { return '<dt>' + esc(p.role) + '</dt><dd>' + esc(p.name) + ' · ' + esc(p.title) + '</dd>'; }).join('') + '</dl></div>' +
      '</div>' +
      '<div id="tab-visits" role="tabpanel" hidden><div class="panel"><div class="panel-head"><h2>跟进记录</h2><small>' + c.visits.length + ' 条</small></div>' +
        (c.visits.length ? '<div class="timeline">' + c.visits.map(function (v) { return '<div class="tl"><span class="dot" aria-hidden="true"></span><details><summary><span>' + esc(v.title) + '</span></summary><div class="when">' + v.date + '</div><div class="body">' + esc(v.body) + '</div>' + (v.next ? '<div class="next"><b>下一步：</b>' + esc(v.next) + '</div>' : '') + '</details></div>'; }).join('') + '</div>' : '<p class="missing">尚无跟进记录。记录首次拜访后，这里会显示时间线。</p>') + '</div></div>' +
      '<div id="tab-tasks" role="tabpanel" hidden><div class="panel"><div class="panel-head"><h2>待办与任务</h2><small>待办来自已归档跟进的下一步；任务含待接受与已接受未完成；未归档草稿的下一步不计入</small></div>' +
        (c.tasks.length ? '<div class="card-list">' + c.tasks.map(function (t) { return '<div class="item"><div><div class="t">' + esc(t.title) + '</div><div class="s">截止 ' + t.due + ' · ' + esc(t.source) + '</div></div><span class="badge ' + (t.status === '待接受' ? 'yellow' : 'gray') + ' plain">' + t.status + '</span></div>'; }).join('') + '</div>' : '<p class="missing">暂无待办与任务。</p>') + '</div></div>' +
      '</div>' +
      '<aside class="detail-side"><div class="panel"><div class="panel-head"><h2>风险与关注</h2><small>' + (attn ? '存在未解除风险' : '无未解除风险') + '</small></div><p><span class="badge ' + c.tone + '">' + TONE[c.tone] + '</span></p><p style="margin-top:8px">' + esc(c.reason) + '</p><p class="note">依据：' + (c.lastFollow ? '最近已归档跟进 ' + fmtDate(c.lastFollow) + '；' : '无已归档跟进记录，建档不足一周；') + (c.core ? '核心客户：一周无跟进即异常，另加两周无高层或技术动作即异常。' : '一周无跟进即异常。') + '判断来自业务规则，不由颜色推断。</p></div>' +
      '<div class="panel"><div class="panel-head"><h2>范围与权限</h2></div><dl class="kv"><dt>数据范围</dt><dd>本人负责</dd><dt>可执行</dt><dd>记录拜访、创建任务、维护关系自评与潜力事实（象限与风险由系统重算，不可改）</dd></dl><p class="note">按钮是否显示不等于权限；以服务端返回为准。</p></div></aside>' +
      '</div>' +
      '<div class="action-bar"><button class="btn btn-secondary" type="button" data-act="task">创建任务</button><button class="btn btn-primary" type="button" data-act="visit">记录拜访</button></div>';
    detailContent.innerHTML = html;
    bindBack();
    var tabs = detailContent.querySelectorAll('.tab');
    function selectTab(name, focus) {
      state.tab = name; save();
      Array.prototype.forEach.call(tabs, function (t) { var on = t.dataset.tab === name; t.setAttribute('aria-selected', String(on)); t.tabIndex = on ? 0 : -1; if (on && focus) t.focus(); });
      ['overview', 'visits', 'tasks'].forEach(function (n) { $('tab-' + n).hidden = n !== name; });
    }
    Array.prototype.forEach.call(tabs, function (t, i) {
      t.addEventListener('click', function () { selectTab(t.dataset.tab, false); });
      t.addEventListener('keydown', function (e) { if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); var n = (i + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length; selectTab(tabs[n].dataset.tab, true); } });
    });
    selectTab(state.tab || 'overview', false);
    Array.prototype.forEach.call(detailContent.querySelectorAll('[data-act]'), function (b) {
      b.addEventListener('click', function () { announce(b.dataset.act === 'visit' ? '样板未实现记录拜访；产品中进入语音录入' : '样板未实现创建任务；产品中打开任务表单'); });
    });
    focusDetail();
  }
  function bindBack() {
    var back = $('back'), close = $('close');
    if (back) back.addEventListener('click', closeDetail);
    if (close) close.addEventListener('click', closeDetail);
  }
  function focusDetail() { var t = stacked() ? $('back') : detailContent.querySelector('h1, .detail-state b'); if (t) { if (!t.hasAttribute('tabindex') && t.tagName !== 'BUTTON') t.tabIndex = -1; t.focus({ preventScroll: true }); } }
  function closeDetail() { if (!EMBEDDED && history.state && history.state.detail) history.back(); else hideDetail(); }
  function hideDetail() {
    app.classList.remove('detail-open');
    detailContent.hidden = true; detailContent.innerHTML = ''; detailEmpty.hidden = false;
    if (!EMBEDDED && location.hash) history.replaceState(null, '', location.pathname + location.search);
    // 返回后：列表、条件与滚动位置未被清空；选中行保持高亮并接回焦点（X-03、C-07）
    listScroll.scrollTop = state.scroll;
    var r = state.selectedId && rows.querySelector('.row[data-id="' + state.selectedId + '"]');
    if (r) { r.focus({ preventScroll: true }); if (r.getBoundingClientRect().bottom > listScroll.getBoundingClientRect().bottom || r.getBoundingClientRect().top < listScroll.getBoundingClientRect().top) r.scrollIntoView({ block: 'nearest' }); }
    announce('已返回客户列表，条件与位置保留');
  }
  window.addEventListener('popstate', function () {
    var m = location.hash.match(/#c=(\w+)/);
    if (m) openDetail(m[1], false); else hideDetail();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && app.classList.contains('detail-open')) { e.preventDefault(); closeDetail(); } });

  // ---------- 演示控制 ----------
  var demo = $('demo'), demoToggle = $('demo-toggle');
  demoToggle.addEventListener('click', function () { var open = demo.hidden; demo.hidden = !open; demoToggle.setAttribute('aria-expanded', String(open)); });
  function syncDemo() {
    var ls = demo.querySelector('input[name="list-state"][value="' + state.listState + '"]'); if (ls) ls.checked = true;
    var ds = demo.querySelector('input[name="detail-state"][value="' + state.detailState + '"]'); if (ds) ds.checked = true;
    $('mode-name').textContent = ({ desktop: '电脑 >900px（三栏并排）', tablet: '收紧 601～900px（图标导航，列表／详情二选一）', mobile: '手机 ≤600px（底部导航，详情整页进入）' })[mode()];
    document.documentElement.dataset.mode = mode();
  }
  function closeDemo() { demo.hidden = true; demoToggle.setAttribute('aria-expanded', 'false'); }
  demo.addEventListener('change', function (e) {
    if (e.target.name === 'list-state') setListState(e.target.value);
    if (e.target.name === 'detail-state') { state.detailState = e.target.value; save(); }
    closeDemo(); // 选定即收起，避免面板挡住要检查的内容（尤其是小屏）
  });
  $('demo-empty').addEventListener('click', function () { state.q = '不存在的客户'; save(); renderList(); closeDemo(); q.focus(); });
  [mqMobile, mqTablet].forEach(function (mq) { mq.addEventListener('change', function () { syncDemo(); if (!stacked()) { app.classList.toggle('detail-open', !!state.selectedId && !detailContent.hidden); } }); });

  // ---------- 被规范站内嵌时接收指令（改变量、切演示状态、设置搜索词） ----------
  window.addEventListener('message', function (e) {
    var d = e.data || {};
    if (d.type === 'set-token' && /^--ui-[a-z0-9-]+$/.test(d.name || '')) { if (d.value == null || d.value === '') document.documentElement.style.removeProperty(d.name); else document.documentElement.style.setProperty(d.name, d.value); }
    if (d.type === 'reset-tokens') document.documentElement.removeAttribute('style');
    if (d.type === 'demo') {
      if (d.list) { state.listState = d.list; save(); renderList(); }
      if (d.detail) { state.detailState = d.detail; save(); }
      if (typeof d.q === 'string') { state.q = d.q; save(); renderList(); }
      if (d.open) { var row = rows.querySelector('.row'); if (row) openDetail(row.dataset.id, true); }
      if (d.close && app.classList.contains('detail-open')) closeDetail();
      syncDemo();
    }
  });

  // ---------- 启动 ----------
  renderList();
  listScroll.scrollTop = state.scroll;
  syncDemo();
  var m0 = location.hash.match(/#c=(\w+)/);
  if (m0) { history.replaceState({ detail: m0[1] }, '', location.hash); openDetail(m0[1], false); }
  else if (state.selectedId && !stacked()) { openDetail(state.selectedId, false); }
})();
</script>
